<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf6f0"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/app-splash.css"><title>Sign in — Alivèra Atelier</title></head><body class="authpage"><div id="appSplash"><img src="/api/brand/logo" alt="Alivèra Atelier logo"><div class="splashMark">Alivèra Atelier</div></div><main class="authshell"><div class="authcard"><a href="/" class="authlogo"><img src="/api/brand/logo" alt="Alivèra Atelier"></a><p class="eyebrow" id="eyebrow">WELCOME TO THE ATELIER</p><h1 id="title">Sign in to your Alivèra account.</h1><p class="authintro" id="intro">Access your orders, saved details and delivery updates.</p><div id="authRoot"></div></div></main><script>
const next=new URLSearchParams(location.search).get('next')||'/account';let mode='login';
const root=document.getElementById('authRoot');
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){const signup=mode==='register';document.getElementById('title').textContent=signup?'Create your Alivèra account.':'Sign in to your Alivèra account.';document.getElementById('intro').textContent=signup?'Save your details, follow orders and make checkout easier.':'Access your orders, saved details and delivery updates.';root.innerHTML=`<form id="authForm">${signup?'<div class="field"><label>Name</label><input name="name" autocomplete="name" required></div>':''}<div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" autocomplete="${signup?'new-password':'current-password'}" required></div><button class="btn dark full" type="submit">${signup?'Create account':'Sign in'}</button><p id="authError" style="color:#9b3a2f;font-size:12px;min-height:18px"></p></form><p style="text-align:center;font-size:13px;color:#746b73">${signup?'Already have an account?':'New to Alivèra?'} <button type="button" id="toggle" style="border:0;background:none;text-decoration:underline;cursor:pointer">${signup?'Sign in':'Create an account'}</button></p>`;document.getElementById('toggle').onclick=()=>{mode=signup?'login':'register';render()};document.getElementById('authForm').onsubmit=submit}
async function submit(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target));const err=document.getElementById('authError');err.textContent='';const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to sign in.');location.href=next}catch(x){err.textContent=x.message;btn.disabled=false}}
render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
